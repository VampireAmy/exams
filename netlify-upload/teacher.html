<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Teacher view – Touchstone quizzes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213D;--soft:#4A5878;--paper:#FBFCFE;--desk:#E9EFF8;--rule:#C9D6EA;--margin:#E8788D;--mark:#FFD23F;
--ok:#0F6F64;--ok-bg:#DDF3EF;--wait:#7A4E00;--wait-bg:#FFF0C7;--bad:#9B1C1C;--bad-bg:#FBE3E1;--focus:#1D4ED8;
--body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;--head:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--ink:#E8EEFB;--soft:#A9B6D3;--paper:#18213A;--desk:#0F1628;--rule:#2C3858;--margin:#C45B73;
--ok:#7FE0D2;--ok-bg:#12403B;--wait:#FFD98A;--wait-bg:#4A3908;--bad:#FFB3AC;--bad-bg:#4A1B19;--focus:#8FB0FF}}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font:400 1.0625rem/1.5 var(--body)}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
a,button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding:clamp(16px,4vw,36px) clamp(12px,3vw,24px) 80px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top nav{display:flex;gap:14px;flex-wrap:wrap}
.top a{color:var(--soft)}
h1{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:800}
.sheet{position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:22px 22px 18px 64px;margin-bottom:18px;
box-shadow:0 1px 0 var(--rule),0 12px 28px -18px rgba(20,33,61,.45)}
.sheet::before{content:"";position:absolute;left:42px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.7}
@media (max-width:560px){.sheet{padding:18px 14px 14px 44px}.sheet::before{left:28px}}
.note{color:var(--soft)}
.err{color:var(--bad);font-weight:700}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.filters label{font-weight:700;display:flex;flex-direction:column;gap:3px;font-size:.95rem}
select,input[type=number]{padding:8px 10px;background:var(--paper);border:1.5px solid var(--soft);border-radius:6px}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.list li{border-bottom:1px solid var(--rule)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 4px;text-decoration:none;align-items:center}
.item:hover{background:color-mix(in srgb,var(--mark) 22%,transparent)}
.item .who{font-weight:700}
.item .meta{color:var(--soft);font-size:.95rem;grid-column:1}
.chip{font-size:.9rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;grid-row:1/3;grid-column:2}
.chip.wait{background:var(--wait-bg);color:var(--wait)}.chip.mid{background:var(--bad-bg);color:var(--bad)}.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.mid{background:var(--wait-bg);color:var(--wait)}
.head-line{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.sec-title{display:flex;gap:10px;align-items:baseline;margin:0 0 4px}
.letter{font-family:var(--head);font-weight:800;background:var(--mark);color:#14213D;padding:0 9px;border-radius:3px}
.q{border-top:1px solid var(--rule);padding:12px 0}
.q .t{font-weight:700;margin:0 0 6px}
.q .a,.q .k{margin:2px 0;padding:6px 10px;border-radius:6px;white-space:pre-wrap}
.q .a{background:color-mix(in srgb,var(--desk) 60%,var(--paper));border:1px dashed var(--soft)}
.q .a.blank{color:var(--soft);font-style:italic}
.q .k{background:var(--ok-bg);color:var(--ok)}
.q .k.none{background:var(--wait-bg);color:var(--wait)}
.pts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.pts input{width:5.5em}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:10px 18px;font-weight:700;cursor:pointer}
.btn.quiet{background:none;color:var(--ink);border:1.5px solid var(--soft)}
.btn.small{padding:5px 12px;font-size:.95rem}
.btn.danger{background:none;color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.6;cursor:wait}
.bar{position:sticky;bottom:0;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
box-shadow:0 -8px 24px -16px rgba(20,33,61,.5)}
.bar .total{font-weight:800;font-family:var(--head);font-size:1.15rem;margin-right:auto}
.toast{margin:0 0 10px;font-weight:700}
.toast.ok{color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Teacher view</h1>
    <nav><a href="index.html">Student menu</a><a href="seed-keys.html">Upload answer keys</a></nav>
  </header>
  <p id="status" class="note" role="status">Checking your account…</p>
  <div id="app" hidden></div>
</div>

<script type="module">
import { auth, db, isConfigured } from './firebase-init.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {
  collection, getDocs, getDoc, doc, updateDoc, deleteDoc, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const $ = s => document.querySelector(s);
const app = $('#app');
const state = { users: new Map(), subs: [], filterStudent: '', filterStatus: '', examCache: new Map(), keyCache: new Map() };

function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid);
  return e;
}

/* ------------------------------------------------------------ data */
// Read a unit's questions straight from its page, so the questions live in one place only.
async function loadExam(book, unit) {
  const id = `${book}_${unit}`;
  if (state.examCache.has(id)) return state.examCache.get(id);
  const res = await fetch(`${book}/${unit}.html`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`Couldn’t find ${book}/${unit}.html`);
  const html = await res.text();
  const m = html.match(/<script type="module">([\s\S]*?)<\/script>/);
  if (!m) throw new Error('Quiz page has no questions script.');
  const code = m[1].replace(/import \{ startExam \} from '[^']+';/, 'const startExam = e => { globalThis.__TS_EXAM = e; };');
  const url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
  try { await import(url); } finally { URL.revokeObjectURL(url); }
  const exam = globalThis.__TS_EXAM;
  delete globalThis.__TS_EXAM;
  state.examCache.set(id, exam);
  return exam;
}

async function loadKey(book, unit) {
  const id = `${book}_${unit}`;
  if (state.keyCache.has(id)) return state.keyCache.get(id);
  const snap = await getDoc(doc(db, 'answerKeys', id));
  const key = snap.exists() ? snap.data().answers : null;
  state.keyCache.set(id, key);
  return key;
}

async function loadAll() {
  const [u, s] = await Promise.all([getDocs(collection(db, 'users')), getDocs(collection(db, 'submissions'))]);
  state.users = new Map();
  u.forEach(d => state.users.set(d.id, d.data()));
  state.subs = [];
  s.forEach(d => state.subs.push({ id: d.id, ...d.data() }));
  state.subs.sort((a, b) => (b.submittedAt?.seconds || 0) - (a.submittedAt?.seconds || 0));
}

const nameOf = uid => { const u = state.users.get(uid); return u ? (u.name || u.email) : 'Unknown student'; };
const unitLabel = s => `${s.book.replace('touchstone', 'Touchstone ')} · Unit ${s.unit.replace('unit', '')}`;
const statusOf = s => s.released ? ['Released', 'ok'] : s.status === 'graded' ? ['Marked, not released', 'mid'] : ['Needs marking', 'wait'];
const when = s => s.submittedAt?.toDate ? s.submittedAt.toDate().toLocaleString() : '';
const accepted = a => String(a).split(' / ');

/* ------------------------------------------------------------ list view */
function renderList(toast) {
  toast = toast || state.pendingToast;
  state.pendingToast = '';
  const students = [...new Set(state.subs.map(s => s.uid))];
  const shown = state.subs.filter(s =>
    (!state.filterStudent || s.uid === state.filterStudent) &&
    (!state.filterStatus || statusOf(s)[1] === state.filterStatus));

  const studentSel = h('select', { id: 'fs', onchange: e => { state.filterStudent = e.target.value; renderList(); } },
    h('option', { value: '', text: 'All students' }),
    students.map(uid => h('option', { value: uid, text: nameOf(uid), selected: uid === state.filterStudent })));
  const statusSel = h('select', { id: 'fst', onchange: e => { state.filterStatus = e.target.value; renderList(); } },
    h('option', { value: '', text: 'Everything' }),
    h('option', { value: 'wait', text: 'Needs marking', selected: state.filterStatus === 'wait' }),
    h('option', { value: 'mid', text: 'Marked, not released', selected: state.filterStatus === 'mid' }),
    h('option', { value: 'ok', text: 'Released', selected: state.filterStatus === 'ok' }));

  const list = h('ul', { class: 'list' }, shown.map(s => {
    const [label, cls] = statusOf(s);
    const score = typeof s.score === 'number' ? ` · ${s.score}/${s.total ?? 50}` : '';
    return h('li', {}, h('a', { class: 'item', href: `#sub=${encodeURIComponent(s.id)}` },
      h('span', { class: 'who', text: `${nameOf(s.uid)} – ${unitLabel(s)}` }),
      h('span', { class: 'chip ' + cls, text: label + score }),
      h('span', { class: 'meta', text: when(s) ? `Submitted ${when(s)}` : '' })));
  }));

  app.replaceChildren(h('section', { class: 'sheet' },
    toast ? h('p', { class: 'toast ok', role: 'status', text: toast }) : null,
    h('h2', { text: 'Submissions' }),
    h('div', { class: 'filters' }, h('label', {}, 'Student', studentSel), h('label', {}, 'Status', statusSel)),
    shown.length ? list : h('p', { class: 'note', text: state.subs.length ? 'No submissions match these filters.' : 'No submissions yet. They appear here when students submit a quiz.' })));
}

/* ------------------------------------------------------------ detail view */
async function renderDetail(id) {
  const sub = state.subs.find(s => s.id === id);
  if (!sub) { renderList(); return; }
  app.replaceChildren(h('p', { class: 'note', text: 'Loading…' }));

  let exam, key;
  try { [exam, key] = await Promise.all([loadExam(sub.book, sub.unit), loadKey(sub.book, sub.unit)]); }
  catch (err) {
    console.error(err);
    app.replaceChildren(h('p', { class: 'err', text: err.message || 'Couldn’t load this quiz.' }), h('a', { href: '#', text: 'Back to submissions' }));
    return;
  }

  const answers = sub.answers || {};
  const inputs = {};
  const totalEl = h('span', { class: 'total' });
  const msg = h('p', { class: 'toast', role: 'status' });
  const questions = exam.sections.flatMap(s => s.questions);

  const suggest = q => {
    if (sub.marks && typeof sub.marks[q.id] === 'number') return sub.marks[q.id];
    if (!key || key[q.id] == null || q.type === 'text') return '';
    return accepted(key[q.id]).includes(answers[q.id] || '') ? q.points : 0;
  };

  const recount = () => {
    let sum = 0, open = 0;
    for (const q of questions) {
      const v = inputs[q.id].value;
      if (v === '') { if (q.type === 'text') open++; } else sum += Number(v) || 0;
    }
    totalEl.textContent = `Score: ${sum} / ${exam.total}` + (open ? `  (${open} typed ${open === 1 ? 'answer' : 'answers'} not marked)` : '');
    return { sum, open };
  };

  const sections = exam.sections.map(sec => h('section', { class: 'sheet' },
    h('div', { class: 'sec-title' }, h('span', { class: 'letter', text: sec.letter }), h('h3', { text: sec.title })),
    sec.questions.map(q => {
      const given = answers[q.id] || '';
      const input = h('input', { type: 'number', min: 0, max: q.points, step: 0.5, 'aria-label': `Points for ${q.text}` });
      input.value = suggest(q);
      input.addEventListener('input', recount);
      inputs[q.id] = input;
      const quick = q.type === 'text' ? [
        h('button', { class: 'btn quiet small', type: 'button', text: 'Correct', onclick: () => { input.value = q.points; recount(); } }),
        h('button', { class: 'btn quiet small', type: 'button', text: 'Wrong', onclick: () => { input.value = 0; recount(); } })
      ] : [];
      return h('div', { class: 'q' },
        h('p', { class: 't', text: q.text }),
        h('p', { class: 'a' + (given ? '' : ' blank'), text: given || '(no answer)' }),
        key && key[q.id] != null
          ? h('p', { class: 'k', text: `Answer: ${key[q.id]}` })
          : h('p', { class: 'k none', text: 'No answer key uploaded for this question.' }),
        h('div', { class: 'pts' }, h('span', { text: 'Points:' }), input, h('span', { text: `of ${q.points}` }), quick));
    })));

  const collectMarks = () => {
    const marks = {};
    for (const q of questions) { const v = inputs[q.id].value; if (v !== '') marks[q.id] = Math.min(q.points, Math.max(0, Number(v) || 0)); }
    return marks;
  };

  const save = async release => {
    const { sum, open } = recount();
    if (release === true && open && !confirm(`${open} typed ${open === 1 ? 'answer is' : 'answers are'} not marked and will count as 0. Release anyway?`)) return;
    setBusy(true);
    try {
      const patch = { marks: collectMarks(), score: sum, total: exam.total, status: 'graded', gradedAt: serverTimestamp() };
      if (typeof release === 'boolean') patch.released = release;
      await updateDoc(doc(db, 'submissions', sub.id), patch);
      Object.assign(sub, patch, { gradedAt: null });
      state.keyCache.delete(`${sub.book}_${sub.unit}`);
      msg.className = 'toast ok';
      msg.textContent = release === true ? 'Saved and released to the student.' : release === false ? 'Saved. Results hidden from the student.' : 'Marks saved.';
      refreshHeader();
    } catch (err) {
      console.error(err);
      msg.className = 'toast err';
      msg.textContent = 'Couldn’t save. Check your connection and the Firestore rules.';
    } finally { setBusy(false); }
  };

  const reset = async () => {
    if (!confirm(`Delete ${nameOf(sub.uid)}’s ${unitLabel(sub)} submission? They will be able to retake it. This can’t be undone.`)) return;
    setBusy(true);
    try {
      await deleteDoc(doc(db, 'submissions', sub.id));
      state.subs = state.subs.filter(s => s.id !== sub.id);
      state.pendingToast = 'Submission deleted. The student can retake this unit.';
      location.hash = '';
    } catch (err) {
      console.error(err);
      msg.className = 'toast err';
      msg.textContent = 'Couldn’t delete. Check your connection and the Firestore rules.';
      setBusy(false);
    }
  };

  const buttons = [];
  const mk = (text, cls, fn) => { const b = h('button', { class: 'btn ' + cls, type: 'button', text, onclick: fn }); buttons.push(b); return b; };
  const setBusy = on => buttons.forEach(b => { b.disabled = on; });

  const statusChip = h('span', { class: 'chip' });
  const refreshHeader = () => { const [l, c] = statusOf(sub); statusChip.className = 'chip ' + c; statusChip.textContent = l; };
  refreshHeader();

  const bar = h('div', { class: 'bar' }, totalEl,
    mk('Save marks', 'quiet', () => save()),
    mk('Save and release', '', () => save(true)),
    sub.released ? mk('Hide results', 'quiet', () => save(false)) : null,
    mk('Delete (let them retake)', 'danger', reset));

  app.replaceChildren(
    h('p', {}, h('a', { href: '#', text: 'Back to submissions' })),
    h('section', { class: 'sheet' },
      h('div', { class: 'head-line' }, h('h2', { text: `${nameOf(sub.uid)} – ${unitLabel(sub)}` }), statusChip),
      h('p', { class: 'note', text: when(sub) ? `Submitted ${when(sub)}` : '' }),
      key ? null : h('p', { class: 'err', text: 'No answer key found for this unit. Upload it with the Upload answer keys page, or mark everything by hand.' }),
      h('p', { class: 'note', text: 'Multiple choice and dropdown answers are marked for you. Typed answers need your marks. You can change any number.' })),
    ...sections, msg, bar);
  recount();
}

/* ------------------------------------------------------------ routing */
function route() {
  const m = location.hash.match(/^#sub=(.+)$/);
  if (m) renderDetail(decodeURIComponent(m[1])); else renderList();
}

if (!isConfigured) {
  $('#status').textContent = 'Firebase isn’t connected yet. Fill in firebase-init.js.';
} else {
  onAuthStateChanged(auth, async user => {
    if (!user) { $('#status').innerHTML = 'Sign in on the <a href="index.html">home page</a> first, then come back.'; return; }
    let teacher = false;
    try { teacher = (await getDoc(doc(db, 'admins', user.uid))).exists(); } catch {}
    if (!teacher) { $('#status').textContent = 'This page is for the teacher account only.'; return; }
    $('#status').textContent = `Signed in as ${user.email}.`;
    try {
      await loadAll();
      app.hidden = false;
      route();
      window.addEventListener('hashchange', route);
    } catch (err) {
      console.error(err);
      $('#status').textContent = 'Couldn’t load submissions. Check your connection and the Firestore rules.';
      $('#status').className = 'err';
    }
  });
}
</script>
</body>
</html>
