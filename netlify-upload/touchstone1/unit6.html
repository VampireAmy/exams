<title>Touchstone 1 – Unit 6 quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>
<main id="exam" class="wrap"></main>
<script type="module">
import { startExam } from '../exam-engine.js?v=2';

const thereIs = ["There's", 'There are'];
const meToo = ['Me too.', 'Me neither.'];
const tf = ['True', 'False'];

startExam({
  book: 'touchstone1',
  unit: 'unit6',
  title: 'Unit 6 Written quiz',
  total: 50,
  sections: [
    { letter: 'A', title: 'Listen to the two conversations. Choose the correct answers.',
      audio: 'audio/unit6.mp3',
      questions: [
        { id: 'A1', type: 'choice', points: 2, text: 'Conversation 1. 1. It’s a very ___ neighborhood.', options: ['big', 'convenient', 'expensive'] },
        { id: 'A2', type: 'choice', points: 2, text: 'Conversation 1. 2. There’s no ___ in the neighborhood.', options: ['supermarket', 'mall', 'park'] },
        { id: 'A3', type: 'choice', points: 2, text: 'Conversation 2. 3. The woman doesn’t like ___.', options: ['Chinese food', 'sandwiches', 'fast food'] },
        { id: 'A4', type: 'choice', points: 2, text: 'Conversation 2. 4. They go to ___ first.', options: ['a bookstore', 'a restaurant', 'an outdoor café'] }
      ] },

    { letter: 'B', title: 'Complete the sentences. Choose There’s or There are.',
      questions: [
        { id: 'B1', type: 'select', points: 1, text: '1. ___ no fast-food restaurants in my neighborhood.', options: thereIs },
        { id: 'B2', type: 'select', points: 1, text: '2. ___ a big park near my house.', options: thereIs },
        { id: 'B3', type: 'select', points: 1, text: '3. ___ no swimming pool in the park.', options: thereIs },
        { id: 'B4', type: 'select', points: 1, text: '4. ___ a couple of outdoor cafés around here.', options: thereIs }
      ] },

    { letter: 'C', title: 'Put the words in the correct order to make questions. Then write the time in words.',
      intro: 'Example: (the local supermarket / what time / does / close)  A: What time does the local supermarket close?  B: 4:15 becomes “A quarter after four” or “Four-fifteen”.',
      questions: [
        { id: 'C1', type: 'text', points: 2, text: '1A. (you / what time / do / leave home / in the morning)  A: ______ ?' },
        { id: 'C2', type: 'text', points: 2, text: '1B. B: 7:45  Write the time in words: ______ .' },
        { id: 'C3', type: 'text', points: 2, text: '2A. (what time / start / does / your favorite TV show)  A: ______ ?' },
        { id: 'C4', type: 'text', points: 2, text: '2B. B: 9:30  Write the time in words: ______ .' },
        { id: 'C5', type: 'text', points: 2, text: '3A. (museums / do / what time / open / on the weekends)  A: ______ ?' },
        { id: 'C6', type: 'text', points: 2, text: '3B. B: 10:00  Write the time in words: ______ .' },
        { id: 'C7', type: 'text', points: 2, text: '4A. (on Fridays / what time / get home / your best friend / does)  A: ______ ?' },
        { id: 'C8', type: 'text', points: 2, text: '4B. B: 6:50  Write the time in words: ______ .' }
      ] },

    { letter: 'D', title: 'Read each sentence. Choose the correct adjective.',
      questions: [
        { id: 'D1', type: 'select', points: 1, text: '1. There’s ___ pool in the park. A lot of people swim in it.', options: ['a big', 'a quiet', 'a boring'] },
        { id: 'D2', type: 'select', points: 1, text: '2. A lot of students live in our apartment building. They listen to loud music all the time. It’s ___ building.', options: ['an expensive', 'a boring', 'a noisy'] },
        { id: 'D3', type: 'select', points: 1, text: '3. My neighborhood is a great place to shop. There’s a mall near here and some great stores. It’s a really ___ neighborhood.', options: ['noisy', 'boring', 'convenient'] },
        { id: 'D4', type: 'select', points: 1, text: '4. There’s ___ restaurant on my street. A lot of rich people live around here!', options: ['an expensive', 'a quiet', 'a boring'] }
      ] },

    { letter: 'E', title: 'Complete the conversation. Choose Me too or Me neither.',
      boxes: [{ title: 'Conversation', text:
        'Jessica: I just love Chicago.\n' +
        'Marisa: (1) ______ . It’s so exciting.\n' +
        'Jessica: Right! There’s a lot to do.\n' +
        'Marisa: Yeah. There are great theaters and restaurants. And I like the neighborhoods.\n' +
        'Jessica: (2) ______ . They’re so interesting. But it’s an expensive city.\n' +
        'Marisa: I know. Big cities are always expensive.\n' +
        'Jessica: Yeah, and they’re noisy, too. I don’t usually like big cities.\n' +
        'Marisa: (3) ______ . And I don’t usually like noisy places.\n' +
        'Jessica: (4) ______ . But Chicago is a fun city for a vacation!' }],
      questions: [
        { id: 'E1', type: 'select', points: 2, text: 'Blank (1)', options: meToo },
        { id: 'E2', type: 'select', points: 2, text: 'Blank (2)', options: meToo },
        { id: 'E3', type: 'select', points: 2, text: 'Blank (3)', options: meToo },
        { id: 'E4', type: 'select', points: 2, text: 'Blank (4)', options: meToo }
      ] },

    { letter: 'F', title: 'Read the friends’ emails. Then choose True or False for each sentence.',
      boxes: [
        { title: 'Email from Tina to Amanda', text:
          'Dear Amanda,\n\n' +
          'How are you? I really miss you and my friends in New York! But I love Miami, and I really like my new neighborhood. There are a lot of stores, cheap restaurants, and great cafés around here. It’s perfect.\n\n' +
          'I’m really busy in my new job. My co-workers are very friendly. One guy is really nice. His name is Rick. He’s very good-looking. We sometimes have coffee together or go out for lunch.\n\n' +
          'I think about you every day. Write back!\nTina' },
        { title: 'Email from Amanda to Tina', text:
          'Dear Tina,\n\n' +
          'It sounds like fun in Miami! You love shopping and you eat out a lot, so your new neighborhood sounds great for you. So tell me more about Rick! How often do you go out? Let’s talk! Call me!\n\n' +
          'My job here is OK. But the store opens at 8:00 a.m. now, so I start work at 7:30 and finish at 3:30. It’s too early for me!\n\n' +
          'We miss you!\nAmanda' }
      ],
      questions: [
        { id: 'F1', type: 'choice', points: 1, text: '1. Tina hates her new neighborhood.', options: tf },
        { id: 'F2', type: 'choice', points: 1, text: '2. There are restaurants and cafés in Tina’s neighborhood.', options: tf },
        { id: 'F3', type: 'choice', points: 1, text: '3. Tina isn’t busy at work.', options: tf },
        { id: 'F4', type: 'choice', points: 1, text: '4. Tina’s co-workers don’t talk to her.', options: tf },
        { id: 'F5', type: 'choice', points: 1, text: '5. Tina works with Rick.', options: tf },
        { id: 'F6', type: 'choice', points: 1, text: '6. Tina lives in Miami.', options: tf },
        { id: 'F7', type: 'choice', points: 1, text: '7. Amanda lives with Tina.', options: tf },
        { id: 'F8', type: 'choice', points: 1, text: '8. Tina likes shopping and restaurants.', options: tf },
        { id: 'F9', type: 'choice', points: 1, text: '9. Amanda’s store opens at 8:00.', options: tf },
        { id: 'F10', type: 'choice', points: 1, text: '10. Amanda works at the store in the evenings.', options: tf }
      ] }
  ]
});
</script>
