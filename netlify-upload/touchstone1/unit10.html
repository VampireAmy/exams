<!doctype html>
<html lang="en" data-touchstone-exam>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Touchstone 1 – Unit 10 quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>
<main id="exam" class="wrap"></main>
<script type="module">
import { startExam } from '../exam-engine.js?v=2';

const tf = ['True', 'False'];
const didForms = ['Did', 'Do', 'Does'];
const baseVerbs = ['buy', 'go', 'have', 'make', 'write'];
const shortAns = ['did', "didn't", 'do', "don't"];
const pastVerbs = ['bought', 'went', 'had', 'made', 'wrote'];
const dBox = ['Congratulations!', 'Good for you!', 'Good luck!', 'Happy birthday!', "I'm sorry to hear that!"];

startExam({
  book: 'touchstone1',
  unit: 'unit10',
  title: 'Unit 10 Written quiz',
  total: 50,
  sections: [
    { letter: 'A', title: 'Ben is talking to a friend about his night. Listen and choose the correct answer for each sentence.',
      audio: 'audio/unit10.mp3',
      questions: [
        { id: 'A1', type: 'choice', points: 1, text: '1. Paulo invited his ___ over.', options: ['friends', 'family'] },
        { id: 'A2', type: 'choice', points: 1, text: '2. Paulo ___.', options: ['watched movies', 'made dinner'] },
        { id: 'A3', type: 'choice', points: 1, text: '3. Paulo watched videos and played ___.', options: ['computer games', 'music'] },
        { id: 'A4', type: 'choice', points: 1, text: '4. Ben ___.', options: ['went to bed early', 'stayed up late'] },
        { id: 'A5', type: 'choice', points: 1, text: '5. Ben got up at about ___.', options: ['5:00 a.m.', '6:00 a.m.'] },
        { id: 'A6', type: 'choice', points: 1, text: '6. Ben went to ___.', options: ['work', 'class'] }
      ] },

    { letter: 'B', title: 'Complete the paragraph. Use the simple past and the words in parentheses. Use contractions where possible.',
      boxes: [{ text: 'Liz (1) ______ (not enjoy) her evening last night. She (2) ______ (want) to go to an outdoor concert, but it (3) ______ (rain), so she just (4) ______ (stay) home. She (5) ______ (study) for a couple of hours. Then she (6) ______ (watch) a movie on TV, but she (7) ______ (not like) it much.' }],
      questions: [
        { id: 'B1', type: 'text', points: 2, text: '(1) not enjoy' },
        { id: 'B2', type: 'text', points: 2, text: '(2) want' },
        { id: 'B3', type: 'text', points: 2, text: '(3) rain' },
        { id: 'B4', type: 'text', points: 2, text: '(4) stay' },
        { id: 'B5', type: 'text', points: 2, text: '(5) study' },
        { id: 'B6', type: 'text', points: 2, text: '(6) watch' },
        { id: 'B7', type: 'text', points: 2, text: '(7) not like' }
      ] },

    { letter: 'C', title: 'Complete the questions and answers. Use the simple past forms of the verbs in the box. Use capital letters where necessary.',
      intro: 'Example: A: Did you make a lot of phone calls this weekend? B: Yes, I did. I made about eight or nine calls.',
      boxes: [
        { title: 'Verbs', text: 'buy    go    have    make    write' },
        { title: 'Conversation 1', text: 'A: (a) ____ you (b) ____ a piano lesson yesterday?\nB: No, I (c) ____ , but I (d) ____ a karate lesson.' },
        { title: 'Conversation 2', text: 'A: (a) ____ your best friend (b) ____ to the party with you?\nB: No, he (c) ____ . He (d) ____ with his girlfriend.' },
        { title: 'Conversation 3', text: 'A: (a) ____ you and your sister (b) ____ a present for your mother?\nB: Yes, we (c) ____ . We (d) ____ a beautiful scarf.' },
        { title: 'Conversation 4', text: 'A: (a) ____ you (b) ____ your report last night?\nB: Yes, I (c) ____ . I (d) ____ it after dinner.' }
      ],
      questions: [1, 2, 3, 4].flatMap(n => [
        { id: `C${n}a`, type: 'select', points: 1, text: `${n}(a) Which word?`, options: didForms },
        { id: `C${n}b`, type: 'select', points: 1, text: `${n}(b) Which verb?`, options: baseVerbs },
        { id: `C${n}c`, type: 'select', points: 1, text: `${n}(c) Short answer`, options: shortAns },
        { id: `C${n}d`, type: 'select', points: 1, text: `${n}(d) Simple past verb`, options: pastVerbs }
      ]) },

    { letter: 'D', title: 'Choose responses to these comments. Use each expression only once. There is one extra expression.',
      boxes: [{ title: 'Expressions', text: dBox.join('\n') }],
      questions: [
        { id: 'D1', type: 'select', points: 1, text: '1. A: I worked late every night last week, and I have to work late tonight, too.  B: ___', options: dBox },
        { id: 'D2', type: 'select', points: 1, text: '2. A: I have a tennis match tomorrow morning.  B: ___', options: dBox },
        { id: 'D3', type: 'select', points: 1, text: '3. A: My girlfriend passed her scuba-diving test, so I’m cooking dinner for her.  B: ___', options: dBox },
        { id: 'D4', type: 'select', points: 1, text: '4. A: I won a trip to Hawaii!  B: ___', options: dBox }
      ] },

    { letter: 'E', title: 'Read Rick’s three emails to Emma. Then choose True or False for each statement.',
      boxes: [
        { title: 'August 13, sent 4:44 p.m.', text: 'Dear Emma,\n\nI just read your email. Yes, I love French movies, and 7:00 is a good time for me. See you tonight!\nRick' },
        { title: 'August 13, sent 7:19 p.m.', text: 'Dear Emma,\n\nI’m sitting at home right now. Where are you? Are you coming over? I sent you an email this afternoon. Did you get it? I wanted to call you, but I don’t have your new cell phone number. You’re late!\nRick' },
        { title: 'August 13, sent 11:46 p.m.', text: 'Dear Emma,\n\nWell, I saw a great movie tonight – with my mother! We watched it at home on TV. Are you OK? You didn’t call me. Anyway, what did you do all night? I watched the movie, and then I did my homework for next week. What about you?\nRick' }
      ],
      questions: [
        { id: 'E1', type: 'choice', points: 1, text: 'a. Emma sent Rick an email first.', options: tf },
        { id: 'E2', type: 'choice', points: 1, text: 'b. Emma wanted to go to the movies.', options: tf },
        { id: 'E3', type: 'choice', points: 1, text: 'c. Rick didn’t want to go to the movies.', options: tf },
        { id: 'E4', type: 'choice', points: 1, text: 'd. Rick called Emma on her cell phone.', options: tf },
        { id: 'E5', type: 'choice', points: 1, text: 'e. Rick had Emma’s new cell phone number.', options: tf },
        { id: 'E6', type: 'choice', points: 1, text: 'f. Rick went to the movies.', options: tf },
        { id: 'E7', type: 'choice', points: 1, text: 'g. Rick’s mother watched a movie at home.', options: tf },
        { id: 'E8', type: 'choice', points: 1, text: 'h. Rick relaxed at home with Emma.', options: tf },
        { id: 'E9', type: 'choice', points: 1, text: 'i. Rick did his homework.', options: tf },
        { id: 'E10', type: 'choice', points: 1, text: 'j. Emma didn’t call Rick.', options: tf }
      ] }
  ]
});
</script>
</body>
</html>
